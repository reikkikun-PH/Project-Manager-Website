<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="icon" href="data:," />
<title>Loading…</title>
<style>
:root{
  --line:#2b2f37; --text:#faf6ec; --muted:#8f877a; --accent:#ff4b1f;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{color:var(--text);font-family:var(--mono);min-height:100vh;min-height:100dvh;
display:flex;align-items:center;justify-content:center;
background:linear-gradient(158deg,#1a1512 0%,#222226 50%,#0a0a0d 100%)}
.wrap{text-align:center;padding:24px}
.ring{width:72px;height:72px;margin:0 auto 20px;position:relative}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;
border:4px solid var(--line);border-top-color:var(--accent);animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#phase{font-size:.8rem;letter-spacing:2px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="ring"></div>
  <div id="phase">LOADING</div>
</div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var manual=(q.get('url')||'').replace(/\/+$/,'');
  var phase=document.getElementById('phase');
  var jumped=false;

  function fetchLive(){
    if(manual) return Promise.resolve(manual);
    return fetch('live.json?t='+Date.now()).then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(j){ return (j.url||'').replace(/\/+$/,''); })
      .catch(function(){
        return fetch('tunnel-url.txt?t='+Date.now()).then(function(r){ if(!r.ok) throw 0; return r.text(); })
          .then(function(t){ return t.trim().replace(/\/+$/,''); })
          .catch(function(){ return ''; });
      });
  }
  function tick(){
    fetchLive().then(function(url){
      if(url && !jumped){ jumped=true; location.href=url; }
      else if(!url){ phase.textContent='WAITING FOR SERVER'; }
    });
  }
  tick();
  setInterval(tick,4000);
})();
</script>
</body>
</html>
